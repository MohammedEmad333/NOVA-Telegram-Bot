services:
  nova-bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKDIR: /downloads
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,uid=10001,gid=10001,mode=1777
      - /downloads:size=2048m,uid=10001,gid=10001,mode=0700
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
