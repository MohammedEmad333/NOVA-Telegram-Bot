services:
  telegram-bot-api:
    image: ghcr.io/gramiojs/telegram-bot-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "8081"
      TELEGRAM_STAT_PORT: "8082"
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
    expose:
      - "8081"
      - "8082"
    group_add:
      - "10001"
    volumes:
      - telegram-api-data:/var/lib/telegram-bot-api
      - nova-downloads:/downloads
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=256m,uid=101,gid=101,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  downloads-init:
    image: alpine:3.21
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown 10001:10001 /downloads && chmod 0770 /downloads"]
    volumes:
      - nova-downloads:/downloads

  nova-bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKDIR: /downloads
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-http://telegram-bot-api:8081}
      TELEGRAM_LOCAL_API: ${TELEGRAM_LOCAL_API:-true}
    depends_on:
      telegram-bot-api:
        condition: service_healthy
      downloads-init:
        condition: service_completed_successfully
    group_add:
      - "10001"
    volumes:
      - nova-downloads:/downloads
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,uid=10001,gid=10001,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  telegram-api-data:
  nova-downloads:
